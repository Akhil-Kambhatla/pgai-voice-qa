[project]
name = "pgai"
version = "0.1.0"
description = "Autonomous voice QA agent that phone-calls and tests patient-facing AI voice agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[websocket,openai,silero,deepgram,runner]>=1.7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "deepgram-sdk>=3.7",
]

[tool.ruff]
line-length = 100
